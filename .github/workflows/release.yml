name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0); created at the dispatched commit if missing"
        required: true

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          # macos-13 (Intel) runners are retired; cross-compile x86_64 on arm64.
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin otto
      - name: Package
        run: |
          d="otto-${{ matrix.target }}"
          mkdir -p "$d/examples"
          cp "target/${{ matrix.target }}/release/otto" README.md "$d/"
          [ -f LICENSE ] && cp LICENSE "$d/"
          cp -R examples/skills "$d/examples/"
          tar -czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: otto-${{ matrix.target }}
          path: otto-${{ matrix.target }}.tar.gz

  tray:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, target: aarch64-apple-darwin }
          - { arch: x86_64, target: x86_64-apple-darwin }
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: tray/src-tauri
          key: tray-${{ matrix.target }}
      # rust-cache keeps ~/.cargo/bin, so this is a no-op on a warm cache.
      - run: cargo install tauri-cli --version '^2' --locked
      - run: cargo tauri build --target ${{ matrix.target }}
        working-directory: tray/src-tauri
      # Unsigned, unnotarized. ditto keeps bundle symlinks/xattrs intact.
      - name: Zip app
        run: |
          ditto -c -k --keepParent \
            "tray/src-tauri/target/${{ matrix.target }}/release/bundle/macos/ottobot tray.app" \
            "ottobot-tray-${{ matrix.arch }}.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: tray-${{ matrix.arch }}
          path: ottobot-tray-${{ matrix.arch }}.app.zip

  release:
    needs: [cli, tray]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
