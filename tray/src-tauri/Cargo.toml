[package]
name = "otto-tray"
version = "0.2.0"
edition = "2021"

# Own workspace: root `members = ["."]` would override a root `exclude`.
[workspace]

[lib]
name = "otto_tray"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
